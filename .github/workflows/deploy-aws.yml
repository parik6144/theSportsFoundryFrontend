name: Deploy Frontend to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            APP_DIR=/var/www/sportsphere-frontend
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            printf '%s\n' "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env
            printf '%s\n' "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env.local
            export NODE_OPTIONS="--max-old-space-size=2048"
            npm ci
            npx prisma generate
            npm run build
            pm2 restart sportsphere-frontend --update-env || pm2 start npm --name sportsphere-frontend -- start
            pm2 save
